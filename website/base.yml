# Settings shared by the Vietnamese (mkdocs.yml) and English (mkdocs.en.yml) sites; each INHERITs this file.
# Relative paths below resolve against website/, where both configs live.
site_url: https://dathoang.github.io/SqlSense/
site_author: Dat Hoang
repo_url: https://github.com/dathoang/SqlSense
repo_name: dathoang/SqlSense
edit_uri: ""
copyright: MIT License © 2026 Dat Hoang

hooks:
  - hooks.py

theme:
  name: material
  custom_dir: overrides   # main.html loads assets/language.js in <head>
  icon:
    logo: material/database-search
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  # Language selector in the header. English is the default at the site root, Vietnamese under /vi/.
  alternate:
    - name: English
      link: /SqlSense/
      lang: en
    - name: Tiếng Việt
      link: /SqlSense/vi/
      lang: vi
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dathoang/SqlSense
