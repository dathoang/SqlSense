# Project site: https://dathoang.github.io/SqlSense/ (built by .github/workflows/pages.yml).
# Two languages, one config each, sharing base.yml:
#   mkdocs.yml     English (default), site root   (guide: deploy/USER-GUIDE.md)
#   mkdocs.vi.yml  Vietnamese, /vi/                (guide: deploy/HUONG-DAN-SU-DUNG.md)
# Build English first: it cleans dist/site, the Vietnamese build then fills dist/site/vi.
# assets/language.js sends first-time visitors whose browser prefers Vietnamese to /vi/ and remembers the choice.
# Local preview: pip install -r website/requirements.txt; mkdocs serve -f website/mkdocs.yml (or mkdocs.vi.yml)
# Not docs/: that folder holds private notes and is git-ignored.
INHERIT: base.yml
site_name: SqlSense
site_description: Schema-aware T-SQL suggestions, autocomplete and a safe SQL formatter for SQL Server Management Studio 22.
docs_dir: src/en
site_dir: ../dist/site

watch:
  - ../deploy/USER-GUIDE.md
  - assets
  - overrides

nav:
  - Home: index.md
  - User guide: user-guide.md

theme:
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search:
      lang: en
