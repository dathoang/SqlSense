# Project site: https://dathoang.github.io/SqlSense/ (built by .github/workflows/pages.yml).
# Two languages, one config each, sharing base.yml:
#   mkdocs.yml     Vietnamese, site root      (guide: deploy/HUONG-DAN-SU-DUNG.md)
#   mkdocs.en.yml  English, /en/              (guide: deploy/USER-GUIDE.md)
# Build Vietnamese first: it cleans dist/site, the English build then fills dist/site/en.
# Local preview: pip install -r website/requirements.txt; mkdocs serve -f website/mkdocs.yml (or mkdocs.en.yml)
# Not docs/: that folder holds private notes and is git-ignored.
INHERIT: base.yml
site_name: SqlSense
site_description: Gợi ý T-SQL theo schema, tự hoàn thành và định dạng SQL an toàn cho SQL Server Management Studio 22.
docs_dir: src/vi
site_dir: ../dist/site

watch:
  - ../deploy/HUONG-DAN-SU-DUNG.md
  - assets

nav:
  - Trang chủ: index.md
  - Hướng dẫn sử dụng: huong-dan.md

theme:
  language: vi
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Chế độ sáng

plugins:
  - search:
      lang: [vi, en]
